<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#ffb700" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <filter id="glow-create" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow-create)">
    <line x1="12" y1="5" x2="12" y2="19" />
    <line x1="5" y1="12" x2="19" y2="12" />
    <circle cx="12" cy="12" r="9" stroke-dasharray="4 2" stroke-width="0.75" />
  </g>
</svg>
