    </filter>
  </defs>
  <g filter="url(#glow-on)">
    <rect x="2" y="7" width="20" height="10" rx="5" stroke="#00ffff" stroke-width="1.5" fill="rgba(0, 255, 255, 0.15)" />
    <circle cx="17" cy="12" r="3.5" fill="#00ffff" />
